name: Format Stripe Integration Branch
on:
  push:
    branches:
      - feature/stripe-checkout-supabase-secure
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format changed application files
        run: |
          bunx prettier --write src/components/booking/BookingFlow.tsx src/lib/booking.functions.ts src/lib/admin.functions.ts src/routes/admin.tsx src/routes/booking_.success.tsx src/routes/booking_.cancelled.tsx supabase/functions/stripe-checkout/index.ts supabase/functions/stripe-webhook/index.ts supabase/functions/booking-api/index.ts docs/stripe-checkout-deployment.md
      - name: Commit formatting to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/booking/BookingFlow.tsx src/lib/booking.functions.ts src/lib/admin.functions.ts src/routes/admin.tsx src/routes/booking_.success.tsx src/routes/booking_.cancelled.tsx supabase/functions/stripe-checkout/index.ts supabase/functions/stripe-webhook/index.ts supabase/functions/booking-api/index.ts docs/stripe-checkout-deployment.md
          if ! git diff --cached --quiet; then
            git commit -m 'style(payments): format new integration code'
            git push
          fi

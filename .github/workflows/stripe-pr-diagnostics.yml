name: Stripe PR Diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Collect formatting, lint, type and build diagnostics
        shell: bash
        run: |
          set +e
          echo "## Stripe PR diagnostics" > report.md
          for task in format:check lint typecheck build; do
            bun run "$task" > "diag-${task//:/-}.log" 2>&1
            result=$?
            echo "### $task (exit $result)" >> report.md
            echo '~~~' >> report.md
            if [ "$result" -ne 0 ]; then
              tail -n 75 "diag-${task//:/-}.log" >> report.md
            else
              echo "Passed" >> report.md
            fi
            echo '~~~' >> report.md
          done
      - name: Publish diagnostics to PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file report.md
